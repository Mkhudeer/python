<!DOCTYPE html>
<html>

<head>

    <title>Craigslist</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-4">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded p-3 mb-4">

    <div class="container-fluid">

        <a
        class="navbar-brand"
        href="{% url 'all_listings' %}">

            Craigslist

        </a>

        <div>

            <a
            class="btn btn-outline-light me-2"
            href="{% url 'all_listings' %}">

                Listings

            </a>

            <a
            class="btn btn-warning me-2"
            href="{% url 'new_listing' %}">

                Post Listing

            </a>

            {% if user.is_authenticated %}

                <span class="text-white me-2">

                    Hello {{ user.username }}

                </span>

                <a
                class="btn btn-danger"
                href="{% url 'logout' %}">

                    Logout

                </a>

            {% else %}

                <a
                class="btn btn-success me-2"
                href="{% url 'login' %}">

                    Login

                </a>

                <a
                class="btn btn-primary"
                href="{% url 'register' %}">

                    Register

                </a>

            {% endif %}

        </div>

    </div>

</nav>

{% if messages %}

    {% for message in messages %}

        <div class="alert alert-danger">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}

{% block content %}
{% endblock %}

</body>
</html>
