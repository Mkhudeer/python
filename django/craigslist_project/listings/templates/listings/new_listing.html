{% extends 'listings/base.html' %}

{% block content %}

<div class="card shadow p-4">

    <h1 class="mb-4">

        Create New Listing

    </h1>

    <form
    method="POST"
    enctype="multipart/form-data"
    novalidate>

        {% csrf_token %}

        {{ form.as_p }}

        <button
        class="btn btn-success"
        type="submit">

            Post Listing

        </button>

    </form>

</div>

{% endblock %}
